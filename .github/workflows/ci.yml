name: Go pipeline test

on:
  push:
    branches: ["main"]


jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: checkout code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'      # You can change this version as needed
        cache: true
    - name: Check go version
      run: go version

    - name: Install dependencies
      run: go mod download

    - name: Run tests
      run: go test ./handlers

    - name: Build the server
      run: go build -o my-app ./server  # Adjust the main file name if different
    
    - name: docker image build
      run: docker build -t sreekuttan121/testing_repo:v1 .

    - name: docker login
      uses: docker/login-action@v4
      with:
        username: ${{ vars.DOCKER_USER_NAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: docker image push
      run: docker push sreekuttan121/testing_repo:v1
  
  ec2-deployment:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Deploy to EC2 using SSH
        uses: appleboy/ssh-action@v1
        env:
          DOCKER_USERNAME: ${{ vars.DOCKER_USER_NAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: DOCKER_USERNAME,DOCKER_PASSWORD
          script: |
            # Login to Docker Hub on the EC2 instance
            echo "$DOCKER_PASSWORD" | sudo docker login -u "$DOCKER_USERNAME" --password-stdin
            
            # Pull the latest image
            sudo docker pull sreekuttan121/testing_repo:v1
            
            # Stop and remove the old container if it exists
            sudo docker stop my-go-app || true
            sudo docker rm my-go-app || true
            
            # Run the new container on port 8080
            sudo docker run -d -p 8080:8080 --name my-go-app sreekuttan121/testing_repo:v1